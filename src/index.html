<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__SITE_NAME__ — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  :root{--bg:#f4f5fa;--surface:#fff;--border:#e7e8f0;--text:#14161f;--muted:#6b7280;--primary:#4f46e5;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:'Inter',system-ui,sans-serif;color:var(--text);
    background:radial-gradient(900px 420px at 10% -10%,rgba(108,92,231,.08),transparent 60%),
               radial-gradient(800px 420px at 100% 0%,rgba(236,72,153,.06),transparent 55%),var(--bg);}
  .card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);
    border-radius:20px;box-shadow:0 10px 30px rgba(20,22,31,.08);padding:32px 28px;}
  .logo{width:52px;height:52px;border-radius:14px;background:var(--primary);color:#fff;
    display:grid;place-items:center;font-size:22px;margin:0 auto 16px;}
  h1{margin:0;font-size:20px;font-weight:700;text-align:center}
  .sub{color:var(--muted);font-size:13px;text-align:center;margin:6px 0 24px}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px}
  .pw-wrap{position:relative}
  input{width:100%;padding:12px 42px 12px 13px;border:1px solid var(--border);border-radius:10px;
    background:#f7f7fb;font-size:14px;font-family:inherit}
  input:focus{outline:none;border-color:var(--primary);background:#fff}
  .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:none;
    color:var(--muted);cursor:pointer;font-size:14px;padding:4px}
  .opt{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:12.5px;color:var(--muted)}
  .opt input{width:16px;height:16px;padding:0;accent-color:var(--primary)}
  button.go{width:100%;padding:12px;border:0;border-radius:10px;background:var(--primary);color:#fff;
    font-family:inherit;font-weight:600;font-size:14px;cursor:pointer}
  button.go:hover{filter:brightness(1.08)}
  button.go:disabled{opacity:.5;cursor:not-allowed}
  .err{display:none;margin-top:14px;padding:10px 12px;border-radius:9px;background:#fef2f2;
    border:1px solid #fecaca;color:#b91c1c;font-size:12.5px}
  .err.show{display:block}
  .foot{text-align:center;margin-top:20px;font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><i class="fas fa-lock"></i></div>
  <h1>__SITE_NAME__</h1>
  <div class="sub">Enter your password to access the tools</div>

  <label for="pw">Password</label>
  <div class="pw-wrap">
    <input type="password" id="pw" autocomplete="current-password" placeholder="••••••••" autofocus>
    <button class="eye" id="eye" type="button" aria-label="Show password"><i class="fas fa-eye"></i></button>
  </div>

  <div class="opt">
    <input type="checkbox" id="remember" checked>
    <label for="remember" style="margin:0;cursor:pointer">Keep me signed in on this device</label>
  </div>

  <button class="go" id="go">Unlock <i class="fas fa-arrow-right"></i></button>
  <div class="err" id="err"><i class="fas fa-triangle-exclamation"></i> <span id="errMsg"></span></div>

  <div class="foot">Protected area · runs entirely in your browser</div>
</div>

<script>
  const PASS_HASH = '__PASS_HASH__';
  const SESSION_HOURS = parseInt('__SESSION_HOURS__', 10) || 12;
  const SESSION_KEY = 'site_auth_v1';
  const FAIL_KEY = 'site_auth_fail_v1';
  const MAX_FAILS = 5, LOCK_MIN = 2;

  async function sha256(text){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  function showErr(msg){
    document.getElementById('errMsg').textContent = msg;
    document.getElementById('err').classList.add('show');
  }
  function hideErr(){ document.getElementById('err').classList.remove('show'); }

  function getFails(){
    try { return JSON.parse(localStorage.getItem(FAIL_KEY)) || {n:0,t:0}; }
    catch(e){ return {n:0,t:0}; }
  }
  function lockedFor(){
    const f = getFails();
    if (f.n < MAX_FAILS) return 0;
    const left = f.t + LOCK_MIN*60000 - Date.now();
    return left > 0 ? Math.ceil(left/1000) : 0;
  }

  // already signed in? go straight to tools
  (function(){
    try{
      const s = JSON.parse(localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY));
      if (s && s.h === PASS_HASH && s.exp > Date.now()) location.replace('tools.html');
    }catch(e){}
  })();

  document.getElementById('eye').addEventListener('click', () => {
    const i = document.getElementById('pw');
    i.type = i.type === 'password' ? 'text' : 'password';
  });

  async function attempt(){
    hideErr();
    const wait = lockedFor();
    if (wait){ showErr(`Too many attempts. Try again in ${wait}s.`); return; }

    const pw = document.getElementById('pw').value;
    if (!pw){ showErr('Please enter your password.'); return; }

    const btn = document.getElementById('go');
    btn.disabled = true;

    const hash = await sha256(pw);
    if (hash === PASS_HASH){
      localStorage.removeItem(FAIL_KEY);
      const payload = JSON.stringify({ h: PASS_HASH, exp: Date.now() + SESSION_HOURS*3600000 });
      (document.getElementById('remember').checked ? localStorage : sessionStorage)
        .setItem(SESSION_KEY, payload);
      location.replace('tools.html');
    } else {
      const f = getFails();
      localStorage.setItem(FAIL_KEY, JSON.stringify({ n: f.n+1, t: Date.now() }));
      const left = MAX_FAILS - (f.n+1);
      showErr(left > 0 ? `Incorrect password. ${left} attempt(s) left.` : 'Locked for 2 minutes.');
      document.getElementById('pw').value = '';
      btn.disabled = false;
    }
  }

  document.getElementById('go').addEventListener('click', attempt);
  document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
</script>
</body>
</html>
