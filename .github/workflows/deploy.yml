name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read .env and inject hash
        run: |
          set -a; source .env; set +a
          if [ -z "$SITE_PASSWORD" ]; then echo "SITE_PASSWORD missing in .env"; exit 1; fi

          HASH=$(printf '%s' "$SITE_PASSWORD" | sha256sum | cut -d' ' -f1)
          HOURS="${SESSION_HOURS:-12}"
          NAME="${SITE_NAME:-Tools}"

          mkdir -p dist
          cp -r src/* dist/

          # replace placeholders in every html file
          find dist -name '*.html' -print0 | while IFS= read -r -d '' f; do
            sed -i "s|__PASS_HASH__|$HASH|g; s|__SESSION_HOURS__|$HOURS|g; s|__SITE_NAME__|$NAME|g" "$f"
          done

          echo "Injected hash: ${HASH:0:12}..."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
